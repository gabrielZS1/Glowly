<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Domínio atual: https://glowly-dusky.vercel.app (Vercel, sem custo).
         Se um dia trocar de domínio, atualize aqui, no canonical, no og:url,
         no robots.txt e no sitemap.xml. -->
    <title>Glowly — Agende salões, barbearias e profissionais de beleza perto de você</title>
    <meta
      name="description"
      content="Glowly é a plataforma que conecta clientes a salões, barbearias, manicures e estúdios de estética. Encontre profissionais perto de você e agende online em segundos."
    />
    <meta name="keywords" content="agendamento online, salão de beleza, barbearia, manicure, estética, marketplace de beleza, app para agendar horário, Glowly" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Glowly" />
    <link rel="canonical" href="https://glowly-dusky.vercel.app/" />

    <!-- Open Graph / compartilhamento em redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glowly" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://glowly-dusky.vercel.app/" />
    <meta property="og:title" content="Glowly — Agende salões, barbearias e profissionais de beleza perto de você" />
    <meta
      property="og:description"
      content="A plataforma que conecta clientes aos melhores profissionais de beleza. Agendamento online, simples e rápido."
    />
    <meta property="og:image" content="https://glowly-dusky.vercel.app/logoglowly.jpg" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glowly — Agende salões, barbearias e profissionais de beleza perto de você" />
    <meta
      name="twitter:description"
      content="A plataforma que conecta clientes aos melhores profissionais de beleza. Agendamento online, simples e rápido."
    />
    <meta name="twitter:image" content="https://glowly-dusky.vercel.app/logoglowly.jpg" />

    <meta name="theme-color" content="#F6C344" />
    <link rel="icon" type="image/jpeg" href="/logoglowly.jpg" />
    <link rel="apple-touch-icon" href="/logoglowly.jpg" />

    <!-- Fontes: pré-conecta e carrega antes do bundle, em vez do @import no CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Glowly",
        "url": "https://glowly-dusky.vercel.app/",
        "logo": "https://glowly-dusky.vercel.app/logoglowly.jpg",
        "description": "Plataforma que conecta clientes a estabelecimentos e profissionais de beleza e bem-estar, com agendamento online.",
        "email": "glowlyapp2701@gmail.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
